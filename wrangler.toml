# Lumi API on Cloudflare Workers.
#   Production (mainnet, api.lumitrades.io):  npx wrangler deploy
#   Testnet staging (workers.dev):            npx wrangler deploy --env testnet
#   Local:                                    npx wrangler dev --env testnet   (or `npm start` for plain Node)
# Secrets (never in this file):               npx wrangler secret put INVOICE_SECRET [--env testnet]
#   Lumi Check (at deploy time, two different secrets): LUMI_CHECK_SIGNING_KEY, CONTRIB_ADMIN_KEY (docs/lumi-check-keys.md)

name = "lumi-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = false

# Custom domain: wrangler creates the DNS record + certificate in the lumitrades.io zone.
routes = [
  { pattern = "api.lumitrades.io", custom_domain = true }
]

[observability]
enabled = true   # Workers Logs: every settled payment logs an `x402_settled` JSON line

[observability.logs]
enabled = true
invocation_logs = false   # no automatic per-request logs (request URLs/headers): keeps the /mcp/<owner key> path out of logs

[vars]
XRPL_NETWORK = "xrpl:0"                                  # mainnet
PAY_TO = "rM8kmmnz5qPMg7V3r7SHYXgDGvm8PhzLvM"             # Lumi's receiving wallet (address only)
FACILITATOR_URL = "https://xrpl-facilitator-mainnet.t54.ai"
SOURCE_TAG = "804681468"
PRICE_SIGNAL_XRP = "0.005"
PRICE_LEVELS_XRP = "0.005"
PRICE_SLATE_XRP = "0.01"
PRICE_MARKET_XRP = "0.01"
PRICE_BRIEF_XRP = "0.015"
PRICE_YEN_XRP = "0.0075"
PRICE_SENTIMENT_XRP = "0.0038"
PRICE_EVENTS_XRP = "0.0038"
PRICE_INSTITUTIONAL_XRP = "0.077"                        # $0.10 at XRP ~= $1.30 (Oct 23 2026); XRP_PRICING=live reprices it
PRICE_VENDOR_REPORT_XRP = "0.015"                        # $0.02 at XRP ~= $1.32 (Oct 22 2026); fixed, not repriced live
# Stablecoins (XRPL issued tokens), offered as accepts[1] RLUSD and accepts[2] USDC. Issuers default to the
# official ones per network (Ripple rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De, Circle rGm7WCVp9gb4jZHWTEtGUr4dd74z2XuWhE).
ACCEPT_RLUSD = "true"
ACCEPT_USDC = "true"
PRICE_SIGNAL_RLUSD = "0.01"
PRICE_LEVELS_RLUSD = "0.01"
PRICE_SLATE_RLUSD = "0.02"
PRICE_MARKET_RLUSD = "0.02"
PRICE_BRIEF_RLUSD = "0.02"
PRICE_YEN_RLUSD = "0.01"
PRICE_SENTIMENT_RLUSD = "0.005"
PRICE_EVENTS_RLUSD = "0.005"
PRICE_INSTITUTIONAL_RLUSD = "0.10"
PRICE_VENDOR_REPORT_RLUSD = "0.02"
PRICE_SIGNAL_USDC = "0.01"
PRICE_LEVELS_USDC = "0.01"
PRICE_SLATE_USDC = "0.02"
PRICE_MARKET_USDC = "0.02"
PRICE_BRIEF_USDC = "0.02"
PRICE_YEN_USDC = "0.01"
PRICE_SENTIMENT_USDC = "0.005"
PRICE_EVENTS_USDC = "0.005"
PRICE_INSTITUTIONAL_USDC = "0.10"
PRICE_VENDOR_REPORT_USDC = "0.02"
DATA_BASE_URL = "https://lumitrades.io/data"
DATA_TTL_SECONDS = "60"
INVOICE_TTL_SECONDS = "300"
PUBLIC_BASE_URL = "https://api.lumitrades.io"
# Base (EVM) USDC over x402: offered as the last accepts[] entry, after every XRPL option. Address only; the key is never here.
EVM_NETWORK = "eip155:8453"                               # Base mainnet
EVM_PAY_TO = "0x5E617bac19912e6d212CB303ae84655E9E203532" # Lumi's Base receiving wallet (address only)
EVM_FACILITATOR_URL = "https://facilitator.payai.network" # keyless fallback; primary is Coinbase CDP when CDP_API_KEY_ID/SECRET secrets are set
ACCEPT_BASE_USDC = "true"                                 # "false" turns the Base option off; prices follow PRICE_<ROUTE>_USDC
# Stellar USDC over x402 (stellar:pubnet, @x402/stellar exact): offered after the XRPL options, same USD prices as Base USDC.
# Facilitator: OpenZeppelin Channels (fees sponsored); its API key is the secret STELLAR_FACILITATOR_API_KEY. Address only here.
STELLAR_NETWORK = "stellar:pubnet"
STELLAR_PAY_TO = "GCKTH26VNR4H4WLCXS5DX6563XRQQXWP5QKQWFD6CHOGTZJ2N5GKBU2L" # Lumi's Stellar wallet (address only)
STELLAR_FACILITATOR_URL = "https://channels.openzeppelin.com/x402"
ACCEPT_STELLAR_USDC = "true"                              # funded 2026-10-23 (3.3 XLM + USDC trustline); "false" turns the option off
# XRP options are priced from a live XRP/USD rate (median of several sources, cached 5 min, then last-known, then fixed PRICE_<R>_XRP).
XRP_PRICING = "live"
SALES_ALERT_FROM = "hello@lumitrades.io"                  # sender for the private sale alert; the recipient is a secret (SALES_ALERT_EMAIL)

# One-time invoice redemption across all isolates/PoPs (required for correctness:
# the facilitator does not reject a replayed, already-settled payment).
# SQLite-backed Durable Objects are available on the Workers Free plan.
[[durable_objects.bindings]]
name = "INVOICE_GUARD"
class_name = "InvoiceGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceGuard"]

# Private sale alerts via Cloudflare Email Routing. No destination here: the recipient is the SALES_ALERT_EMAIL
# secret and must be a verified Email Routing destination address on the lumitrades.io zone.
[[send_email]]
name = "SALES_EMAIL"

# Trust layer v0: vendor observations, probes, verified reports, private tips, replies.
#   npx wrangler d1 migrations apply lumi_trust --remote
[[d1_databases]]
binding = "TRUST_DB"
database_name = "lumi_trust"
database_id = "7ddfc495-8500-40cf-88eb-6d7d4121f19b"
migrations_dir = "migrations"

# */30: free 402-quote checks of allowlisted vendors and the x402 catalog (no payment).
# every minute: live signals for the 4 stalest coins (1 daily refresh) of the top-50 universe (src/live.ts; must match LIVE_CRON in src/index.ts).
[triggers]
crons = ["*/30 * * * *", "* * * * *"]

# x402 catalog work fan-out (Bazaar ingest pages + quote-check batches), one small job per invocation so each
# stays inside the Workers Free limits (50 subrequests, 10 ms CPU). Roughly 2.2k messages/day.
[[queues.producers]]
binding = "TRUST_QUEUE"
queue = "lumi-trust-jobs"

[[queues.consumers]]
queue = "lumi-trust-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 3   # D1 handles one write at a time; keeps upstream request rates polite

# Lumi Check contributor submissions (not deployed). Writes are batched so a burst of
# submissions becomes a few D1 batches; contributions have their own daily row budget (contrib_writes:YYYY-MM-DD)
# and never spend the catalog's `writes:` budget. Create first: wrangler queues create lumi-contrib-writes
[[queues.producers]]
binding = "CONTRIB_QUEUE"
queue = "lumi-contrib-writes"

[[queues.consumers]]
queue = "lumi-contrib-writes"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
max_concurrency = 1

