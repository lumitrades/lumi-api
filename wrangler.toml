PRICE_SIGNAL_XRP = "0.005"
PRICE_LEVELS_XRP = "0.005"
PRICE_SLATE_XRP = "0.01"
PRICE_MARKET_XRP = "0.01"
PRICE_BRIEF_XRP = "0.015"
PRICE_YEN_XRP = "0.0075"
PRICE_SENTIMENT_XRP = "0.0038"
PRICE_EVENTS_XRP = "0.0038"
PRICE_INSTITUTIONAL_XRP = "0.077"
PRICE_VENDOR_REPORT_XRP = "0.015"
DATA_BASE_URL = "https://lumitrades.io/data"
DATA_TTL_SECONDS = "60"
INVOICE_TTL_SECONDS = "300"
PUBLIC_BASE_URL = ""   # empty = use the request origin (workers.dev / localhost)
EVM_NETWORK = "eip155:84532"                              # Base Sepolia
EVM_PAY_TO = "0x5E617bac19912e6d212CB303ae84655E9E203532"
EVM_FACILITATOR_URL = "https://x402.org/facilitator"      # x402.org public testnet facilitator

# Contributor request rate limit (Lumi Check). NOT enabled: needs owner approval and a deploy.
# Workers Rate Limiting keeps per-key counters outside D1 (no row writes) and across isolates in a location.
# Without it the limiter is per isolate (in memory), which is documented in docs/contributors-antigaming.md.
